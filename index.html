<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Tower Hanoi — classic Tower of Hanoi puzzle: 3-8 disks, hints, AI demo, PERFECT star for optimal play. Free single-file HTML5 game.">
<title>Tower Hanoi · Classic Puzzle</title>
<script>
// 平台 SDK 按域名条件加载（独立运行时完全不加载，游戏行为不变）
(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0d0d1a; font-family:-apple-system,"Segoe UI",sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud { width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; padding:8px 14px 2px; color:#e8e8f2; }
  .stat { text-align:center; min-width:56px; }
  .stat .label { font-size:10px; color:#8a8aa8; letter-spacing:1px; }
  .stat .val { font-size:18px; font-weight:800; }
  #title { font-size:13px; font-weight:800; color:#e8b04a; letter-spacing:2px; text-align:center; }
  canvas { display:block; border-radius:14px; touch-action:none; width:min(480px, 100%, calc((100vh - 156px) * 0.7742)); }
  #controls { display:flex; gap:8px; padding:8px 6px 2px; }
  #controls button { background:#222240; color:#cfd0ea; border:1px solid #3a3a5e; border-radius:10px; padding:8px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  #controls button:active { transform:scale(.96); }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,8,18,.78); z-index:5; border-radius:14px; }
  #panel { background:#171730; border:1px solid #30305a; border-radius:18px; padding:22px 28px; text-align:center; color:#fff; max-width:400px; }
  #panel h2 { font-size:22px; margin-bottom:6px; color:#e8b04a; letter-spacing:1px; }
  #panel p { color:#9a9ac0; font-size:12.5px; margin-bottom:12px; line-height:1.5; }
  #diskBtns { display:flex; gap:6px; justify-content:center; margin-bottom:12px; }
  #diskBtns button { width:38px; height:38px; border-radius:10px; border:1px solid #3a3a5e; background:#222240; color:#cfd0ea; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
  #diskBtns button.sel { background:linear-gradient(135deg,#e8b04a,#d67f2a); color:#1a1030; border-color:#e8b04a; }
  .bigBtn { background:linear-gradient(135deg,#e8b04a,#d67f2a); color:#1a1030; border:none; border-radius:12px; padding:11px 30px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; margin:3px; }
  .bigBtn.alt { background:#222240; color:#cfd0ea; border:1px solid #3a3a5e; }
  .bigBtn:active { transform:scale(.97); }
  #bestNote { font-size:12px; color:#8a8aa8; margin-bottom:10px; }
  #star { font-size:38px; line-height:1; margin-bottom:4px; }
  #winStats { font-size:15px; font-weight:800; color:#ffd76a; margin-bottom:4px; }
  #winSub { font-size:12px; color:#9a9ac0; margin-bottom:14px; }
  #footer { color:#55556e; font-size:11px; padding:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><div class="label">MOVES</div><div class="val" id="moves">0</div></div>
    <div id="title">TOWER HANOI</div>
    <div class="stat"><div class="label">OPTIMAL</div><div class="val" id="opt">7</div></div>
    <div class="stat"><div class="label">BEST</div><div class="val" id="best">-</div></div>
  </div>
  <div style="position:relative">
    <canvas id="game" width="480" height="620"></canvas>
    <div id="overlay">
      <div id="panel">
        <div id="menuBox">
          <h2>TOWER HANOI</h2>
          <p>Move the whole stack to the right peg.<br>One disk at a time — never a big disk on a smaller one.</p>
          <div id="diskBtns"></div>
          <div id="bestNote"></div>
          <button class="bigBtn" id="playBtn">PLAY</button>
          <button class="bigBtn alt" id="demoBtn">DEMO</button>
        </div>
        <div id="winBox" style="display:none">
          <div id="star"></div>
          <h2 id="winTitle">SOLVED!</h2>
          <div id="winStats"></div>
          <div id="winSub"></div>
          <button class="bigBtn" id="againBtn">PLAY AGAIN</button>
          <button class="bigBtn alt" id="menuBtn">MENU</button>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="hintBtn">HINT (3)</button>
    <button id="menuBtn2">MENU</button>
    <button id="soundBtn">SOUND ON</button>
  </div>
  <div id="footer">Tower Hanoi — a free classic puzzle game</div>
</div>
<script>
"use strict";
// ================= 纯规则引擎（无 DOM 依赖，可被 Node 单测直接调用） =================
// disks：编号 1..N，1 最小。pegs[p] = 自底向上的盘号数组。目标：全部到柱 2（最右）。
var pegs = [[], [], []];
var nDisks = 3, moves = 0, hintsLeft = 3, hintM = null;

function topDisk(p) { var a = pegs[p]; return a.length ? a[a.length - 1] : 0; }
function canDropOn(size, p) {
  if (p < 0 || p > 2 || !size) return false;
  var t = topDisk(p);
  return t === 0 || size < t;
}
function pegOfDisk(size) {
  for (var p = 0; p < 3; p++) if (pegs[p].indexOf(size) !== -1) return p;
  return -1;
}
function isSolved() { return pegs[2].length === nDisks; }
function applyMove(from, to) {
  var d = topDisk(from);
  if (!d || !canDropOn(d, to)) return false;
  pegs[to].push(pegs[from].pop());
  return true;
}
function setupBoard(n) {
  nDisks = n; pegs = [[], [], []]; moves = 0; hintsLeft = 3; hintM = null;
  for (var s = n; s >= 1; s--) pegs[0].push(s);
}
// 任意合法局面下，把 1..k 号盘移到 target 的最优解的第一步（经典递归判据）
function optimalNextMove(k, target) {
  if (k <= 0) return null;
  var cur = pegOfDisk(k);
  if (cur === target) return optimalNextMove(k - 1, target);
  var aux = 3 - cur - target;
  for (var s = 1; s < k; s++) if (pegOfDisk(s) !== aux) return optimalNextMove(k - 1, aux);
  return { from: cur, to: target };
}
function hintMove() { return optimalNextMove(nDisks, 2); }
// 独立实现：当前局面到目标的最少步数（公式法），用于对拍
function optDistance(k, target) {
  if (k <= 0) return 0;
  var cur = pegOfDisk(k);
  if (cur === target) return optDistance(k - 1, target);
  var aux = 3 - cur - target;
  return optDistance(k - 1, aux) + 1 + ((1 << (k - 1)) - 1);
}
// 纯函数：对给定局面（不依赖全局）生成一条完整解法序列（演示模式用）
function solvePegs(startState, n) {
  var sim = [startState[0].slice(), startState[1].slice(), startState[2].slice()];
  var seq = [];
  function findPeg(k) { for (var p = 0; p < 3; p++) if (sim[p].indexOf(k) !== -1) return p; return -1; }
  function rec(k, target) {
    if (k <= 0) return;
    var cur = findPeg(k);
    if (cur === target) { rec(k - 1, target); return; }
    var aux = 3 - cur - target;
    var ready = true;
    for (var s = 1; s < k; s++) if (findPeg(s) !== aux) { ready = false; break; }
    if (ready) { sim[target].push(sim[cur].pop()); seq.push({ from: cur, to: target }); rec(k - 1, target); }
    else { rec(k - 1, aux); sim[target].push(sim[cur].pop()); seq.push({ from: cur, to: target }); rec(k - 1, target); }
  }
  rec(n, 2);
  return seq;
}

// 平台埋点（域名守卫由 loader 负责）
function gameplayStart() {
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStart();
    }
  } catch (e) {}
}
function gameplayStop() {
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStop();
    }
  } catch (e) {}
}

// ================= 浏览器层 =================
function bootGame() {
  var W = 480, H = 620;
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.maxWidth = "480px";
  ctx.scale(dpr, dpr);

  var DISK_H = 30, PEG_H = 272;
  var BASE_Y = 550;                    // 底座顶面
  var PEG_X = [90, 240, 390];
  var HOVER_Y = 216;                   // 悬浮带
  var state = "MENU";                  // MENU | PLAY | WIN
  var demo = false, demoT = 0, demoPhase = "pick", demoTo = -1;
  var held = null;                     // {size, from, x, y, home}
  var isDown = false, dragMoved = false, gesturePicked = false, downX = 0, downY = 0;
  var shakeP = -1, shakeT = 0;
  var winT = 0, wasDemo = false, newBest = false;
  var particles = [], flashMsg = "", flashT = 0, tick = 0;
  var bests = {};
  var muted = false;

  // ---------- 本地存储（全部 try/catch） ----------
  try { muted = localStorage.getItem("th_muted") === "1"; } catch (e) {}
  for (var b = 3; b <= 8; b++) {
    try { var v = localStorage.getItem("th_best_" + b); if (v) bests[b] = parseInt(v, 10) || 0; } catch (e) {}
  }
  try { var lastN = parseInt(localStorage.getItem("th_n") || "3", 10); if (lastN >= 3 && lastN <= 8) nDisks = lastN; } catch (e) {}

  // ---------- 音效（WebAudio 合成） ----------
  var actx = null;
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  function beep(freq, dur, type, gainv, delay) {
    if (muted) return;
    try {
      ensureAudio();
      if (!actx) return;
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(gainv || 0.1, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }
  var sPickup = function () { beep(560, 0.06, "triangle", 0.07); beep(760, 0.05, "triangle", 0.05, 0.05); };
  var sDrop = function () { beep(230, 0.09, "sine", 0.1); beep(115, 0.13, "sine", 0.08, 0.01); };
  var sIllegal = function () { beep(110, 0.22, "sawtooth", 0.08); };
  var sClick = function () { beep(700, 0.04, "square", 0.035); };
  var sWin = function () {
    var m = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < m.length; i++) beep(m[i], 0.22, "triangle", 0.09, i * 0.13);
  };
  var sPerfect = function () { beep(1318.5, 0.3, "sine", 0.08, 0.55); beep(1568, 0.4, "sine", 0.08, 0.68); };

  // ---------- DOM 引用 ----------
  var el = {};
  ["moves", "opt", "best", "overlay", "menuBox", "winBox", "star", "winTitle", "winStats", "winSub",
   "bestNote", "diskBtns", "playBtn", "demoBtn", "againBtn", "menuBtn", "hintBtn", "menuBtn2", "soundBtn"]
   .forEach(function (id) { el[id] = document.getElementById(id); });

  function fmtBest(n) { return bests[n] ? bests[n] + "" : "-"; }
  function updateHUD() {
    el.moves.textContent = moves;
    el.opt.textContent = (1 << nDisks) - 1;
    el.best.textContent = fmtBest(nDisks);
    el.hintBtn.textContent = "HINT (" + hintsLeft + ")";
    el.soundBtn.textContent = muted ? "SOUND OFF" : "SOUND ON";
  }
  function buildDiskBtns() {
    el.diskBtns.innerHTML = "";
    for (var n = 3; n <= 8; n++) {
      (function (nn) {
        var btn = document.createElement("button");
        btn.textContent = nn;
        if (nn === nDisks) btn.className = "sel";
        btn.addEventListener("click", function () { selectDisks(nn); });
        el.diskBtns.appendChild(btn);
      })(n);
    }
  }
  function selectDisks(n) {
    nDisks = n;
    try { localStorage.setItem("th_n", String(n)); } catch (e) {}
    buildDiskBtns();
    updateHUD();
    showMenu(); // 菜单态刷新预览塔与最佳成绩
    sClick();
  }
  function showMenu() {
    state = "MENU"; demo = false; held = null; particles = [];
    setupBoard(nDisks); // 菜单背景展示预览塔
    el.menuBox.style.display = "block"; el.winBox.style.display = "none";
    el.overlay.style.display = "flex";
    el.bestNote.textContent = bests[nDisks]
      ? "Best for " + nDisks + " disks: " + bests[nDisks] + " moves (optimal " + ((1 << nDisks) - 1) + ")"
      : "No best yet for " + nDisks + " disks — optimal is " + ((1 << nDisks) - 1) + " moves";
    updateHUD();
  }
  function startGame(asDemo) {
    setupBoard(nDisks);
    state = "PLAY"; demo = !!asDemo; wasDemo = demo;
    demoT = 0.5; demoPhase = "pick"; demoTo = -1;
    held = null; particles = []; hintM = null; newBest = false;
    el.overlay.style.display = "none";
    updateHUD();
    gameplayStart();
    sClick();
  }
  function optimalMoves() { return (1 << nDisks) - 1; }

  // ---------- 胜利 ----------
  function startWin() {
    state = "WIN"; winT = 0;
    gameplayStop();
    try {
      if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
        window.CrazyGames.SDK.game.happytime();
      }
    } catch (e) {}
    sWin(); if (moves === optimalMoves() && !wasDemo) sPerfect();
    if (!wasDemo && (!bests[nDisks] || moves < bests[nDisks])) {
      bests[nDisks] = moves; newBest = true;
      try { localStorage.setItem("th_best_" + nDisks, String(moves)); } catch (e) {}
    }
    updateHUD();
    setTimeout(showWinPanel, 1600);
  }
  function showWinPanel() {
    if (state !== "WIN") return;
    var perfect = moves === optimalMoves();
    el.star.textContent = perfect ? "\u2605" : "\u2606";
    el.star.style.color = perfect ? "#ffd76a" : "#6a6a8a";
    el.winTitle.textContent = wasDemo ? "DEMO FINISHED" : (perfect ? "PERFECT!" : "SOLVED!");
    el.winStats.textContent = moves + " moves" + (perfect ? "  \u00b7  optimal \u2713" : "  \u00b7  optimal " + optimalMoves());
    el.winSub.textContent = wasDemo
      ? "The AI played an optimal solution. Now try it yourself!"
      : (newBest ? "NEW BEST for " + nDisks + " disks!" : "Best for " + nDisks + " disks: " + bests[nDisks] + " moves");
    el.menuBox.style.display = "none"; el.winBox.style.display = "block";
    el.overlay.style.display = "flex";
  }

  // ---------- 提示 ----------
  function useHint() {
    if (state !== "PLAY" || demo || held) { if (held) flash("Finish the move first"); return; }
    if (hintsLeft <= 0) { flash("No hints left"); sIllegal(); return; }
    hintsLeft--;
    hintM = hintMove();
    if (!hintM) { hintsLeft++; return; }
    updateHUD(); sClick();
  }
  function flash(msg) { flashMsg = msg; flashT = 1.4; }

  // ---------- 输入：拿起 / 放下（二段式点击 + 拖拽） ----------
  function pegAt(x, y) {
    if (y < 60 || y > H) return -1;
    var p = Math.round((x - 90) / 150);
    if (p < 0) p = 0; if (p > 2) p = 2;
    return Math.abs(x - PEG_X[p]) <= 75 ? p : -1;
  }
  function pickUp(p) {
    held = { size: pegs[p].pop(), from: p, x: PEG_X[p], y: HOVER_Y, home: false };
    gesturePicked = true;
    sPickup();
  }
  function putBack() {
    pegs[held.from].push(held.size);
    held = null; gesturePicked = false;
    sDrop();
  }
  function tryDrop(p) {
    if (canDropOn(held.size, p)) {
      pegs[p].push(held.size);
      held = null; gesturePicked = false; hintM = null;
      moves++; updateHUD(); sDrop();
      if (isSolved()) startWin();
    } else {
      shakeP = p; shakeT = 0.32; sIllegal();
      held.home = true; // 弹回原柱上方悬浮
      flash("A big disk cannot sit on a smaller one");
    }
  }
  function canvasPos(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left) / rect.width * W, y: (clientY - rect.top) / rect.height * H };
  }
  function onDown(x, y) {
    ensureAudio();
    if (state !== "PLAY" || demo) return;
    isDown = true; dragMoved = false; downX = x; downY = y;
    if (!held) {
      var p = pegAt(x, y);
      if (p >= 0 && pegs[p].length) pickUp(p);
    }
  }
  function moveHeld(x, y) {
    if (!held) return;
    held.home = false; // 指针接管，取消回位动画
    held.x = Math.max(28, Math.min(W - 28, x));
    if (isDown) held.y = Math.max(84, Math.min(BASE_Y - DISK_H, y));
    if (Math.abs(x - downX) > 9 || Math.abs(y - downY) > 9) dragMoved = true;
  }
  function onUp(x, y) {
    isDown = false;
    if (state !== "PLAY" || demo || !held) return;
    var p = pegAt(x, y);
    if (dragMoved) {
      if (p >= 0 && p !== held.from) tryDrop(p);
      else if (p === held.from) putBack();
      else held.home = true;
    } else {
      if (gesturePicked) { gesturePicked = false; held.home = true; return; } // 拿起的那次点击本身
      if (p === held.from) putBack();
      else if (p >= 0) tryDrop(p);
    }
    dragMoved = false;
  }

  // ---------- 渲染 ----------
  function diskW(s) { return 56 + (s - 1) * 12; }
  function diskHue(s) { return 8 + (s - 1) * 40; }
  function roundRect(c, x, y, w, h, rad) {
    c.beginPath();
    c.moveTo(x + rad, y);
    c.arcTo(x + w, y, x + w, y + h, rad);
    c.arcTo(x + w, y + h, x, y + h, rad);
    c.arcTo(x, y + h, x, y, rad);
    c.arcTo(x, y, x + w, y, rad);
    c.closePath();
  }
  function drawDisk(x, y, size, glow) {
    var w = diskW(size), h = DISK_H, hue = diskHue(size);
    ctx.save();
    if (glow) { ctx.shadowColor = "hsl(" + hue + ",90%,65%)"; ctx.shadowBlur = glow; }
    var g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    g.addColorStop(0, "hsl(" + hue + ",78%,62%)");
    g.addColorStop(1, "hsl(" + hue + ",72%,42%)");
    ctx.fillStyle = g;
    roundRect(ctx, x - w / 2, y - h / 2, w, h, 9); ctx.fill();
    ctx.shadowBlur = 0;
    // 顶部高光 + 中心孔
    ctx.fillStyle = "rgba(255,255,255,.28)";
    roundRect(ctx, x - w / 2 + 5, y - h / 2 + 3, w - 10, 6, 3); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawScene() {
    // 背景
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#1a1a34"); bg.addColorStop(1, "#0d0d1a");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // 步骤条：当前步数 / 最优步数
    var frac = Math.min(1, moves / optimalMoves());
    ctx.fillStyle = "rgba(255,255,255,.08)";
    roundRect(ctx, W / 2 - 90, 14, 180, 7, 4); ctx.fill();
    if (frac > 0.02) {
      ctx.fillStyle = moves > optimalMoves() ? "#e06070" : "#e8b04a";
      roundRect(ctx, W / 2 - 90, 14, 180 * frac, 7, 4); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.font = "10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("OPT", W / 2 + 106, 21);

    // 底座
    var wood = ctx.createLinearGradient(0, BASE_Y, 0, BASE_Y + 20);
    wood.addColorStop(0, "#8a5a2b"); wood.addColorStop(1, "#5f3d1d");
    ctx.fillStyle = wood;
    roundRect(ctx, 18, BASE_Y, W - 36, 20, 6); ctx.fill();
    // 柱子
    for (var p = 0; p < 3; p++) {
      var ox = (p === shakeP && shakeT > 0) ? Math.sin(shakeT * 55) * 4 * (shakeT / 0.32) : 0;
      var pg = ctx.createLinearGradient(PEG_X[p] - 6, 0, PEG_X[p] + 6, 0);
      pg.addColorStop(0, "#9a6b3a"); pg.addColorStop(0.5, "#b8844a"); pg.addColorStop(1, "#7a5230");
      ctx.fillStyle = pg;
      roundRect(ctx, PEG_X[p] - 5 + ox, BASE_Y - PEG_H, 10, PEG_H + 2, 5); ctx.fill();
      ctx.beginPath(); ctx.arc(PEG_X[p] + ox, BASE_Y - PEG_H, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#b8844a"; ctx.fill();
      // 提示标记（金色脉冲箭头）
      if (hintM && state === "PLAY" && (p === hintM.from || p === hintM.to)) {
        var bob = Math.sin(tick * 5) * 4;
        var ay = BASE_Y - PEG_H - 26 + bob;
        ctx.fillStyle = "#ffd76a";
        ctx.shadowColor = "#ffd76a"; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(PEG_X[p] + ox, ay + 14);
        ctx.lineTo(PEG_X[p] + ox - 9, ay);
        ctx.lineTo(PEG_X[p] + ox + 9, ay);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
      }
      // 柱上的盘
      for (var i = 0; i < pegs[p].length; i++) {
        var glow = 0;
        if (state === "WIN") {
          var order = i; // 自底向上逐个发光
          var gt = winT - 0.25 - order * 0.14;
          if (gt > 0 && gt < 0.6) glow = 26 * Math.sin(gt / 0.6 * Math.PI);
          else if (winT > 0.25 + pegs[p].length * 0.14) glow = 8 + 5 * Math.sin(tick * 4 + i);
        }
        drawDisk(PEG_X[p] + ox, BASE_Y - (i + 1) * DISK_H + DISK_H / 2, pegs[p][i], glow);
      }
    }
    // 悬浮盘 + 投影
    if (held) {
      var shR = diskW(held.size) * 0.42;
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(held.x, BASE_Y + 4, shR, 6, 0, 0, Math.PI * 2); ctx.fill();
      drawDisk(held.x, held.y, held.size, 16);
    }
    // 烟花（胜利）
    for (var q = particles.length - 1; q >= 0; q--) {
      var pt = particles[q];
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 引导文案 / 演示横幅 / 闪光消息
    ctx.textAlign = "center";
    if (state === "PLAY" && demo) {
      ctx.fillStyle = "rgba(255,215,106,.9)"; ctx.font = "700 14px sans-serif";
      ctx.fillText("DEMO \u00b7 optimal solution \u00b7 " + moves + " moves", W / 2, 46);
    } else if (state === "PLAY" && moves === 0 && !held) {
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "13px sans-serif";
      ctx.fillText("Tap a peg to lift its top disk, then tap a target peg", W / 2, 46);
    }
    if (flashT > 0) {
      ctx.globalAlpha = Math.min(1, flashT);
      ctx.fillStyle = "#ffb0b8"; ctx.font = "700 13px sans-serif";
      ctx.fillText(flashMsg, W / 2, 66);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 主循环 ----------
  var last = 0;
  function frame(t) {
    var dt = Math.min((t - last) / 1000, 0.05); last = t;
    tick += dt;
    if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeP = -1; }
    if (flashT > 0) flashT -= dt;
    // 悬浮盘回位/摆动
    if (held) {
      if (held.home) {
        held.x += (PEG_X[held.from] - held.x) * Math.min(1, dt * 10);
        held.y += ((HOVER_Y + Math.sin(tick * 3) * 5) - held.y) * Math.min(1, dt * 10);
      } else if (!isDown && state === "PLAY") {
        held.y = HOVER_Y + Math.sin(tick * 3) * 5;
      }
    }
    // 演示模式：拿起 -> 放下
    if (demo && state === "PLAY") {
      demoT -= dt;
      if (demoT <= 0) {
        if (demoPhase === "pick") {
          var m = hintMove();
          if (!m || isSolved()) { startWin(); }
          else {
            demoTo = m.to;
            pickUp(m.from);
            demoPhase = "drop"; demoT = 0.45;
          }
        } else {
          if (held) {
            held.x = PEG_X[demoTo];
            var dd = canDropOn(held.size, demoTo);
            if (dd) { tryDrop(demoTo); } else { putBack(); }
          }
          demoPhase = "pick"; demoT = isSolved() ? 0.1 : 0.42;
          if (held) demoPhase = "pick"; // 保险
        }
      }
    }
    // 胜利烟花
    if (state === "WIN") {
      winT += dt;
      if (winT < 3.2 && Math.random() < dt * 5) {
        var fx = 50 + Math.random() * (W - 100), fy = 60 + Math.random() * 240;
        var col = "hsl(" + Math.floor(Math.random() * 360) + ",85%,65%)";
        for (var k = 0; k < 22; k++) {
          var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 150;
          particles.push({ x: fx, y: fy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.9 + Math.random() * 0.4, color: col, size: 1.5 + Math.random() * 2.5 });
        }
      }
    }
    for (var q = particles.length - 1; q >= 0; q--) {
      var pt = particles[q];
      pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 130 * dt;
      if (pt.life <= 0) particles.splice(q, 1);
    }
    drawScene();
    requestAnimationFrame(frame);
  }

  // ---------- 事件绑定 ----------
  canvas.addEventListener("mousedown", function (e) { var p = canvasPos(e.clientX, e.clientY); onDown(p.x, p.y); });
  document.addEventListener("mousemove", function (e) {
    if (!held) return;
    var p = canvasPos(e.clientX, e.clientY); moveHeld(p.x, p.y);
  });
  document.addEventListener("mouseup", function (e) {
    if (!isDown && !held) return;
    var p = canvasPos(e.clientX, e.clientY); onUp(p.x, p.y);
  });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.touches[0]; var p = canvasPos(t.clientX, t.clientY); onDown(p.x, p.y);
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    if (isDown || held) e.preventDefault();
    if (!held || !e.touches.length) return;
    var t = e.touches[0]; var p = canvasPos(t.clientX, t.clientY); moveHeld(p.x, p.y);
  }, { passive: false });
  document.addEventListener("touchend", function (e) {
    if (!isDown && !held) return;
    var t = e.changedTouches[0];
    if (t) { var p = canvasPos(t.clientX, t.clientY); onUp(p.x, p.y); }
    else onUp(-99, -99);
  }, { passive: false });
  document.addEventListener("keydown", function (e) {
    if (e.key === "h" || e.key === "H") useHint();
    else if (e.key === "m" || e.key === "M") toggleMute();
    else if (e.key === "Escape" && state !== "MENU") { gameplayStop(); showMenu(); }
    else if (state === "MENU" && e.key >= "3" && e.key <= "8") selectDisks(parseInt(e.key, 10));
  });

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem("th_muted", muted ? "1" : "0"); } catch (e) {}
    updateHUD();
    if (!muted) sClick();
  }
  el.playBtn.addEventListener("click", function () { startGame(false); });
  el.demoBtn.addEventListener("click", function () { startGame(true); });
  el.againBtn.addEventListener("click", function () { startGame(false); });
  el.menuBtn.addEventListener("click", function () { sClick(); showMenu(); });
  el.menuBtn2.addEventListener("click", function () {
    sClick();
    if (state === "PLAY") gameplayStop();
    showMenu();
  });
  el.hintBtn.addEventListener("click", useHint);
  el.soundBtn.addEventListener("click", toggleMute);

  buildDiskBtns();
  updateHUD();
  showMenu();
  requestAnimationFrame(frame);
}

if (typeof document !== "undefined" && document.getElementById("game")) bootGame();
// 测试钩子（Node 单测直接读取引擎；不影响游戏逻辑）
if (typeof window !== "undefined") {
  window.__th = {
    get pegs() { return pegs; }, set pegs(v) { pegs = v; },
    get n() { return nDisks; }, set n(v) { nDisks = v; },
    get moves() { return moves; },
    topDisk: topDisk, canDropOn: canDropOn, pegOfDisk: pegOfDisk, isSolved: isSolved,
    applyMove: applyMove, setupBoard: setupBoard,
    optimalNextMove: optimalNextMove, hintMove: hintMove,
    optDistance: optDistance, solvePegs: solvePegs
  };
}
</script>
</body>
</html>
